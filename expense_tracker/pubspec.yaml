name: expense_tracker
description: An expense tracker with daily spend graphs, UPI QR scan-and-pay tracking, and local SQLite storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local SQLite database
  sqflite: ^2.3.0
  path: ^1.8.3
  # State management
  provider: ^6.1.1
  # Charts (daily expense graph, category breakdown)
  fl_chart: ^0.66.0
  # UPI QR code scanning
  mobile_scanner: ^4.0.1
  # Launching UPI apps via upi:// deep links
  url_launcher: ^6.2.4
  # Date / currency formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
