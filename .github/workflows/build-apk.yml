name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/brave-mayer-0p4xdq
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'expense_tracker/**'
      - '.github/workflows/build-apk.yml'
  # Allows running the build manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build expense tracker APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense_tracker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense_tracker/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Pushing a tag like v1.0.0 publishes the APK as a GitHub Release,
  # which gives a permanent public download link.
  release:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: expense-tracker-apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
